name: Build HUMA TRADERS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
          test -f HUMA_TRADERS_MOBILE_GITHUB_ACTIONS_APK_PROJECT.zip
          unzip -q HUMA_TRADERS_MOBILE_GITHUB_ACTIONS_APK_PROJECT.zip
          cp -R HUMA_TRADERS_COMPLETE_UPGRADE/android ./android

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HUMA-TRADERS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
