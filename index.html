<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huma Traders - Smart Advance Billing & POS</title>

    <!-- PWA Web App Manifest (Embedded Data URL) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Huma Traders POS","short_name":"Huma POS","start_url":".","display":"standalone","background_color":"#b45309","theme_color":"#b45309","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3144/3144456.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#b45309">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        // Register PWA Service Worker for Offline Usage
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'huma-pos-v1';
                    self.addEventListener('install', (e) => {
                        e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob))
                    .then(() => console.log('PWA Service Worker Registered Successfully!'))
                    .catch(err => console.log('SW Registration failed: ', err));
            });
        }
    </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- TOP HEADER -->
    <header class="bg-gradient-to-r from-amber-700 via-amber-600 to-amber-800 text-white shadow-md no-print sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-white text-amber-700 flex items-center justify-center font-bold text-xl shadow-inner border border-amber-300">
                    <i class="fa-solid me-0.5 fa-store"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight leading-none uppercase">Huma Traders</h1>
                    <p class="text-xs text-amber-200 mt-0.5 font-medium">Smart Advance Billing & POS • Solapur</p>
                </div>
            </div>

            <div class="flex items-center space-x-3 text-xs sm:text-sm">
                <button id="pwa-install-btn" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-bold shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> Install App
                </button>
                <div class="bg-amber-800/60 backdrop-blur px-3 py-1.5 rounded-lg border border-amber-500/30 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-day text-amber-300"></i>
                    <span id="current-date-time" class="font-medium">--</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-3 sm:p-6">
        <div class="bg-white p-6 rounded-2xl shadow border border-slate-200 text-center py-12">
            <i class="fa-solid fa-mobile-screen-button text-6xl text-amber-600 mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-800">Huma Traders PWA Ready!</h2>
            <p class="text-sm text-slate-500 mt-2">Apne mobile browser me options kholkar <b>"Add to Home Screen"</b> ya <b>"Install App"</b> par click karein.</p>
        </div>
    </main>

    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwa-install-btn');
            if(btn) {
                btn.classList.remove('hidden');
                btn.addEventListener('click', () => {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(() => {
                        btn.classList.add('hidden');
                    });
                });
            }
        });
    </script>
</body>
</html>
