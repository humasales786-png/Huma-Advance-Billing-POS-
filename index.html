
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUMA TRADERS - Thermal Bill</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2f2;margin:0;padding:15px;color:#111}
.panel{max-width:420px;margin:auto;background:white;padding:16px;border-radius:12px}
h2{text-align:center;margin:0 0 5px}
label{display:block;font-size:13px;margin-top:12px}
input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #bbb;border-radius:6px;font-size:15px}
button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:7px;background:#047857;color:white;font-weight:bold;font-size:15px}
button.secondary{background:#374151}
#receipt{width:58mm;max-width:100%;margin:18px auto;background:white;padding:3mm;font-size:11px}
.center{text-align:center}
.small{font-size:10px}
hr{border:0;border-top:1px dashed #555;margin:7px 0}
table{width:100%;border-collapse:collapse;font-size:10px}
th,td{padding:4px 1px;text-align:left;overflow-wrap:anywhere}
th:last-child,td:last-child{text-align:right}
.total{text-align:right;font-weight:bold;font-size:14px}
#qr{display:block;width:36mm;height:36mm;margin:8px auto}
@media print{
 @page{size:58mm auto;margin:0}
 body{padding:0;margin:0;background:white}
 body *{visibility:hidden}
 #receipt,#receipt *{visibility:visible}
 #receipt{position:absolute;left:0;top:0;width:58mm;max-width:none;margin:0;padding:3mm;font-size:11px}
 .no-print{display:none!important}
}
</style>
</head>
<body>
<div class="panel no-print">
<h2>HUMA TRADERS</h2>
<p class="center">58mm Thermal Bill + UPI QR</p>

<label>Bill Number</label>
<input id="billNo" value="HT-1001">

<label>Customer Name</label>
<input id="customer" value="Walk-in Customer">

<label>Item Name</label>
<input id="item" value="Toor Dal">

<label>Quantity</label>
<input id="qty" type="number" min="0.001" step="0.001" value="1">

<label>Rate (₹)</label>
<input id="rate" type="number" min="0" step="0.01" value="160">

<label>Discount (₹)</label>
<input id="discount" type="number" min="0" step="0.01" value="0">

<label>Payment Mode</label>
<select id="payment">
<option>Cash</option>
<option>UPI</option>
<option>Khata</option>
</select>

<button onclick="updateBill()">Update Bill & QR</button>
<button onclick="window.print()">Print 58mm Bill</button>
<button class="secondary" onclick="downloadQR()">Download QR Image</button>
</div>

<section id="receipt">
<div class="center">
<h3 style="margin:0">HUMA TRADERS</h3>
<div class="small">Solapur, Maharashtra</div>
<div style="font-weight:bold;margin-top:8px">SALES RECEIPT</div>
</div>
<hr>
<div>Bill: <span id="rBill"></span></div>
<div>Date: <span id="rDate"></span></div>
<div>Customer: <span id="rCustomer"></span></div>
<hr>
<table>
<thead><tr><th>ITEM</th><th>QTY</th><th>RATE</th><th>AMT</th></tr></thead>
<tbody><tr>
<td id="rItem"></td><td id="rQty"></td>
<td id="rRate"></td><td id="rAmount"></td>
</tr></tbody>
</table>
<hr>
<div class="small" style="text-align:right">Subtotal: ₹<span id="rSubtotal"></span></div>
<div class="small" style="text-align:right">Discount: ₹<span id="rDiscount"></span></div>
<div class="total">TOTAL: ₹<span id="rTotal"></span></div>
<div class="small" style="text-align:right">Payment: <span id="rPayment"></span></div>
<hr>
<div class="center">
<strong>Scan to Pay via UPI</strong>
<img id="qr" alt="UPI payment QR">
<div class="small">HUMA TRADERS</div>
<div class="small">UPI: 9022157137-4@axl</div>
<div class="small">Payment successful hone par hi bill paid maanein.</div>
<hr>
Thank you! Visit Again.
</div>
</section>

<script>
const UPI_ID = "9022157137-4@axl";
const PAYEE = "HUMA TRADERS";

function money(n){return (Number(n)||0).toFixed(2)}
function updateBill(){
 const qty=Math.max(0,Number(document.getElementById('qty').value)||0);
 const rate=Math.max(0,Number(document.getElementById('rate').value)||0);
 const subtotal=qty*rate;
 const discount=Math.min(subtotal,Math.max(0,Number(document.getElementById('discount').value)||0));
 const total=Math.max(0,subtotal-discount);
 const payment=document.getElementById('payment').value;

 document.getElementById('rBill').textContent=document.getElementById('billNo').value;
 document.getElementById('rDate').textContent=new Date().toLocaleString('en-IN');
 document.getElementById('rCustomer').textContent=document.getElementById('customer').value;
 document.getElementById('rItem').textContent=document.getElementById('item').value;
 document.getElementById('rQty').textContent=qty;
 document.getElementById('rRate').textContent=money(rate);
 document.getElementById('rAmount').textContent=money(subtotal);
 document.getElementById('rSubtotal').textContent=money(subtotal);
 document.getElementById('rDiscount').textContent=money(discount);
 document.getElementById('rTotal').textContent=money(total);
 document.getElementById('rPayment').textContent=payment;

 const params=new URLSearchParams({
  pa:UPI_ID,
  pn:PAYEE,
  am:total.toFixed(2),
  cu:"INR",
  tn:"Bill "+document.getElementById('billNo').value
 });
 const upiUri="upi://pay?"+params.toString();
 // QR image uses a third-party QR rendering service; internet is required.
 document.getElementById('qr').src=
  "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(upiUri);
 document.getElementById('qr').dataset.upi=upiUri;
}
function downloadQR(){
 const img=document.getElementById('qr');
 if(!img.src || !img.complete || !img.naturalWidth){
  alert("Pehle QR load hone dein; internet connection check karein.");return;
 }
 fetch(img.src).then(r=>r.blob()).then(blob=>{
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='HUMA-TRADERS-UPI-QR.png';a.click();
  URL.revokeObjectURL(url);
 }).catch(()=>alert("QR download nahi hua. Bill par QR print kar sakte hain."));
}
updateBill();
</script>
</body>
</html>
